<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هور | منصة التجارة المتعددة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">هور | منصة التجارة المتعددة</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchPage('homePage')">🏠 الرئيسية</button>
            <button class="nav-btn" onclick="switchPage('storePage')" style="background:var(--secondary); color:#fff;">👤 الملف الشخصي ومتجري</button>
            <button class="nav-btn" onclick="switchPage('adminPage')" style="background:#475569; color:#fff;">🛠️ لوحة المبرمج</button>
        </div>
    </header>

    <!-- FLOATING CART BUTTON -->
    <div id="cartFloatBtn" class="cart-float" style="display:none;" onclick="switchPage('cartPage')">
        🛒 سلة الشراء (<span id="cartCount">0</span>)
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="main-container">

        <!-- 1. HOME PAGE -->
        <div id="homePage" class="page-view active">
            <div class="panel">
                <h2>مرحباً بكم في منصة هور 🛍️</h2>
                <p style="color:#64748b; font-size:0.9rem; margin-top:5px;">المنصة العراقية الأولى لإنشاء المتاجر الإلكترونية بكل سهولة.</p>
                <div id="homeMainContainer" style="margin-top:20px;">
                    <div style="text-align:center; padding:30px; color:#94a3b8;">
                        اختر متجراً أو افتح رابط متجر خاص لتسوق المنتجات مباشرة.
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. STORE / PROFILE PAGE -->
        <div id="storePage" class="page-view">
            <div class="panel">
                <div id="storePageContent">
                    <!-- سيتم تعبئته ديناميكياً عبر الجافاسكريبت -->
                </div>
            </div>
        </div>

        <!-- ADD PRODUCT PAGE -->
        <div id="addProductPage" class="page-view">
            <div class="container">
                <div class="panel" style="max-width: 500px; margin: 0 auto;">
                    <h3 style="margin-bottom: 15px; color: var(--secondary);">إضافة منتج جديد لمتجرك</h3>
                    <div class="form-group">
                        <label class="form-label">اسم المنتج:</label>
                        <input type="text" id="pName" class="form-control" placeholder="مثال: فستان سهرة كوري">
                    </div>
                    <div class="form-group">
                        <label class="form-label">السعر (د.ع):</label>
                        <input type="text" id="pPrice" class="form-control" placeholder="25,000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">وصف المنتج:</label>
                        <textarea id="pDesc" class="form-control" placeholder="تفاصيل المنتج، المقاسات، أو طريقة التحميل..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">صورة المنتج (اضغط لاختيار صورة من جهازك):</label>
                        <input type="file" id="pImageFile" class="form-control" accept="image/*" style="padding: 7px;">
                    </div>
                    <button class="btn-main" onclick="saveProductWithImage()">حفظ ونشر المنتج</button>
                    <button class="btn-main" style="background:#64748b; margin-top:8px;" onclick="switchPage('storePage')">رجوع لمتجري</button>
                </div>
            </div>
        </div>

        <!-- 3. CART / CHECKOUT PAGE -->
        <div id="cartPage" class="page-view">
            <div class="panel" style="max-width: 500px; margin: 0 auto;">
                <h3 style="margin-bottom: 15px; color: var(--primary);">سلة التسوق وإتمام الطلب 🛒</h3>
                <div id="cartItemsList" style="margin-bottom: 15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <!-- المنتجات داخل السلة -->
                </div>
                <h4 style="margin-bottom: 10px; font-size: 0.9rem; color:#334155;">معلومات التوصيل:</h4>
                <div class="form-group"><label class="form-label">الاسم الكامل:</label><input type="text" id="cName" class="form-control" placeholder="اسمك الكريم"></div>
                <div class="form-group"><label class="form-label">رقم الهاتف:</label><input type="text" id="cPhone" class="form-control" placeholder="07xxxxxxxxx"></div>
                <div class="form-group"><label class="form-label">عنوان التوصيل (المحافظة / المنطقة):</label><input type="text" id="cAddress" class="form-control" placeholder="مثال: بغداد - الكرادة"></div>
                <div class="form-group">
                    <label class="form-label">طريقة الدفع:</label>
                    <select id="cPayment" class="form-control">
                        <option value="الدفع عند الاستلام">الدفع عند الاستلام (نقداً)</option>
                        <option value="زين كاش">زين كاش</option>
                    </select>
                </div>
                <button class="btn-main" onclick="checkoutOrder()">تأكيد وإرسال الطلب نهائياً</button>
                <button class="btn-main" style="background:#64748b; margin-top:8px;" onclick="switchPage('homePage')">متابعة التسوق</button>
            </div>
        </div>

        <!-- 4. ADMIN PANEL -->
        <div id="adminPage" class="page-view">
            <div class="panel">
                <h3 style="color: var(--primary); margin-bottom: 15px;">لوحة تحكم ومتابعة المبرمج 🛠️</h3>
                <div id="adminPanelContent">
                    <!-- سيتم تعبئته ديناميكياً -->
                </div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
