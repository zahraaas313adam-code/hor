<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هور | HOR - منصة التجارة المتعددة</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #d97706;
            --dark: #0f172a;
            --light: #f8fafc;
            --gold: #b45309;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: var(--dark);
            padding-bottom: 50px;
        }
        /* Top Navigation Bar */
        .navbar {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-brand {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fbbf24;
        }
        .nav-btns {
            display: flex;
            gap: 8px;
        }
        .btn-nav {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-nav:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Search & Categories Section */
        .search-section {
            padding: 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-box-wrapper {
            display: flex;
            gap: 8px;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: white;
        }
        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar {
            display: none;
        }
        .cat-chip {
            background: #e2e8f0;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-chip.active, .cat-chip:hover {
            background: var(--secondary);
            color: white;
        }

        /* Hero Logo Section */
        .hero-section {
            text-align: center;
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hero-logo {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1e3a8a, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 15px;
            font-family: 'Times New Roman', Times, serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }
        .hero-slogan {
            font-size: 1.25rem;
            font-weight: bold;
            color: #334155;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="nav-brand">هور | HOR - منصة التجارة المتعددة</div>
        <div class="nav-btns">
            <button class="btn-nav">🔍 بحث</button>
            <button class="btn-nav">👤 الملف الشخصي ومتجري</button>
        </div>
    </div>

    <!-- Search & Categories -->
    <div class="search-section">
        <div class="search-box-wrapper">
            <input type="text" class="search-input" placeholder="ابحث عن المتاجر، الملابس، المجوهرات، أو الملفات الرقمية...">
            <button class="search-btn">بحث</button>
        </div>
        <div class="categories-scroll">
            <button class="cat-chip active">الكل</button>
            <button class="cat-chip">ملابس</button>
            <button class="cat-chip">مجوهرات وإكسسوارات</button>
            <button class="cat-chip">الرقمي (فرش رسم رقمي)</button>
        </div>
    </div>

    <!-- Hero Branding Section -->
    <div class="hero-section">
        <div class="hero-logo">HOR</div>
        <div class="hero-slogan">هور......... شراء سهل، بيع أسهل</div>
    </div>

</body>
</html>
