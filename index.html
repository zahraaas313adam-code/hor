<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هور | HOR</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 0; text-align: center; }
        .navbar { background: #0f172a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #d97706; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .hero { padding: 40px 20px; background: white; border-bottom: 1px solid #e2e8f0; }
        .logo { font-size: 4rem; font-weight: bold; color: #1e3a8a; margin-bottom: 10px; }
        .slogan { font-size: 1.1rem; color: #475569; font-weight: bold; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: right; border: 1px solid #e2e8f0; }
        .price { color: #d97706; font-weight: bold; margin-top: 8px; display: inline-block; }
    </style>
</head>
<body>

    <div class="navbar">
        <span style="color: #fbbf24; font-weight: bold;">هور | HOR</span>
        <button class="btn" onclick="alert('منصة هور: متاح لأي تاجر عرض منتجاته المادية أو ملفاته الرقمية!')">+ افتح متجرك</button>
    </div>

    <div class="hero">
        <div class="logo">HOR</div>
        <div class="slogan">هور......... شراء سهل، بيع أسهل</div>
    </div>

    <div class="container">
        <h3 style="margin-bottom: 15px; text-align: right;">أحدث المنتجات والمتاجر</h3>
        
        <div class="card">
            <h4>🎨 حزمة فرش مانها ورسم رقمي (ملف رقمي)</h4>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 5px;">متجر أصول الرسم - يتطلب الدفع المسبق (زين كاش) ليرسل الرابط فوراً.</p>
            <span class="price">15,000 د.ع</span>
        </div>

        <div class="card">
            <h4>👗 فستان سهرة كوري ملكي (منتج مادي)</h4>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 5px;">متجر روز للأزياء - متاح الدفع عند الاستلام أو الإلكتروني.</p>
            <span class="price">45,000 د.ع</span>
        </div>
    </div>

</body>
</html>
