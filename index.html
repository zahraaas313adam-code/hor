/* ------------------------------------------------------------
   MINI CHARTS — tiny self-contained SVG charts (no chart library),
   used instead of recharts so this file needs zero build step.
   ------------------------------------------------------------ */
function MiniLineChart({ data, color, formatValue }) {
  const w = 600, h = 220, pad = 28;
  const values = data.map((d) => d.revenue);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = Math.max(max - min, 1);
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = pad + (1 - (d.revenue - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const path = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const areaPath = `${path} L${points[points.length - 1][0]},${h - pad} L${points[0][0]},${h - pad} Z`;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height: 240 }} preserveAspectRatio="none">
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke={C.line} strokeWidth="1" />
      <path d={areaPath} fill={color} opacity="0.08" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color} />
      ))}
    </svg>
  );
}

};

};

/* ============================================================
   PERSISTENT STORAGE (localStorage)
   ============================================================
   Keeps every piece of platform data (stores, products, orders,
   settings, cart, current session) saved in the browser so a page
   refresh or revisit never loses data or resets counters to zero. */
const STORAGE_PREFIX = "souqna:";

function readStorage(key, fallback) {
  try {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    console.warn(`تعذّرت قراءة "${key}" من التخزين المحلي، سيتم استخدام القيمة الافتراضية.`, err);
    return fallback;
  }
}

function usePersistentState(key, fallback) {
  const [state, setState] = useState(() => readStorage(key, fallback));

  useEffect(() => {
    try {
      window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(state));
    } catch (err) {
      console.warn(`تعذّر حفظ "${key}" في التخزين المحلي (قد تكون المساحة ممتلئة).`, err);
    }
  }, [key, state]);

  return [state, setState];
}

function clearAllStoredData() {
  Object.keys(window.localStorage)
    .filter((k) => k.startsWith(STORAGE_PREFIX))
    .forEach((k) => window.localStorage.removeItem(k));
  window.location.reload();
}

                        <>
                          <button onClick={() => setStatus(s.id, "active")}
                            className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-white" style={{ backgroundColor: C.sage }}>
                            <CheckCircle2 className="w-3.5 h-3.5" /> موافقة
                          </button>
                          <button onClick={() => setStatus(s.id, "blocked")}
                            className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium" style={{ backgroundColor: C.rosewoodSoft, color: C.rosewood }}>
                            <Ban className="w-3.5 h-3.5" /> رفض
                          </button>
                        </>
                      )}
                      {s.status === "active" && (
                        <button onClick={() => setStatus(s.id, "blocked")}
                          className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium" style={{ backgroundColor: C.rosewoodSoft, color: C.rosewood }}>
                          <Ban className="w-3.5 h-3.5" /> حظر
                        </button>
                      )}
                      {s.status === "blocked" && (
                        <button onClick={() => setStatus(s.id, "active")}
                          className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-white" style={{ backgroundColor: C.ink }}>
                          <Undo2 className="w-3.5 h-3.5" /> إلغاء الحظر
                        </button>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length === 0 && (
                <tr>
                  <td colSpan={7} className="py-12 text-center text-sm" style={{ color: C.slate }}>
                    {stores.length === 0
                      ? "لا توجد متاجر على المنصة بعد. عندما ينشئ تاجر متجرًا جديدًا، سيظهر هنا للمراجعة والموافقة."
                      : "لا توجد متاجر مطابقة لبحثك."}
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <GlobalSettings settings={settings} setSettings={setSettings} showToast={showToast} />
    </div>
  );
}

function GlobalSettings({ settings, setSettings, showToast }) {

  const dirty = JSON.stringify(draft) !== JSON.stringify(settings);

  return (
    <div className="bg-white rounded-2xl border p-6" style={{ borderColor: C.line }}>

              <option key={code} value={code}>{CURRENCY_META[code].label} ({code})</option>

        </Field>

      <div className="grid sm:grid-cols-2 gap-3 mt-5">

          onChange={(v) => setDraft({ ...draft, allowSignups: v })} />
        <Toggle label="وضع الصيانة" desc="تظهر المتاجر العامة رسالة مؤقتة للزوار" checked={draft.maintenance}
          onChange={(v) => setDraft({ ...draft, maintenance: v })} />
      </div>

      <div className="flex flex-wrap items-center justify-between gap-3 mt-6">
        <button onClick={save} disabled={!dirty}
          className="px-4 py-2 rounded-lg text-sm font-medium text-white disabled:opacity-40"
          style={{ backgroundColor: C.ink }}>
          حفظ التغييرات
        </button>
        <button onClick={() => setConfirmReset(true)}
          className="px-4 py-2 rounded-lg text-sm font-medium" style={{ backgroundColor: C.rosewoodSoft, color: C.rosewood }}>
          إعادة تعيين المنصة بالكامل
        </button>
      </div>

      {confirmReset && (
        <ConfirmDialog
          title="مسح جميع بيانات المنصة؟"
          body="سيؤدي هذا إلى حذف كل المتاجر والمنتجات والطلبات والإعدادات المحفوظة على هذا الجهاز بشكل نهائي، وستبدأ المنصة من جديد فارغة تمامًا. لا يمكن التراجع عن هذا الإجراء."
          confirmLabel="مسح كل البيانات"
          danger
          onCancel={() => setConfirmReset(false)}
          onConfirm={clearAllStoredData}
        />
      )}
    </div>
  );
}

function Toggle({ label, desc, checked, onChange }) {
  return (
    <button onClick={() => onChange(!checked)}
      className="flex items-center justify-between gap-3 rounded-xl border px-4 py-3 text-right"
      style={{ borderColor: C.line }}>
      <div>
        <p className="text-sm font-medium" style={{ color: C.ink }}>{label}</p>
        <p className="text-xs" style={{ color: C.slate }}>{desc}</p>
      </div>
      <span className="w-10 h-6 rounded-full p-0.5 shrink-0 transition" style={{ backgroundColor: checked ? C.sage : "#D8D3C4" }}>
        <span className="block w-5 h-5 rounded-full bg-white transition" style={{ transform: checked ? "translateX(-16px)" : "translateX(0)" }} />
      </span>
    </button>
  );
}

function CreateStoreScreen({ onCreate }) {
  const [form, setForm] = useState({ name: "", category: "", owner: "" });
  const [errors, setErrors] = useState({});

  const submit = () => {
    const errs = {};
    if (!form.name.trim()) errs.name = "هذا الحقل مطلوب";
    if (!form.category.trim()) errs.category = "هذا الحقل مطلوب";
    if (!form.owner.trim()) errs.owner = "هذا الحقل مطلوب";
    setErrors(errs);
    if (Object.keys(errs).length) return;

    const slug = "store-" + Date.now().toString().slice(-6);
    onCreate({
      id: Date.now(),
      slug,
      name: form.name.trim(),
      owner: form.owner.trim(),
      category: form.category.trim(),
      status: "pending",
      plan: "Starter",
      revenue: 0,
      orders: 0,
      joined: new Date().toISOString().slice(0, 10),
      accent: ACCENT_SWATCHES[0],
      logoInitial: form.name.trim().slice(0, 2),
      tagline: "أضف وصفًا مميزًا لمتجرك",
      banner: "minimal",
    });
  };

  return (
    <div className="max-w-lg mx-auto bg-white rounded-2xl border p-7" style={{ borderColor: C.line }}>
      <div className="w-11 h-11 rounded-xl flex items-center justify-center mb-4" style={{ backgroundColor: C.marigoldSoft }}>
        <Store className="w-5 h-5" style={{ color: C.marigoldDark }} />
      </div>
      <h1 className="text-xl font-semibold" style={{ ...heading, color: C.ink }}>أنشئ متجرك</h1>
      <p className="text-sm mt-1.5 mb-6" style={{ color: C.slate }}>أضف تفاصيل متجرك للبدء في البيع على المنصة. سيُرسل متجرك للمراجعة قبل ظهوره للعامة.</p>

      <div className="space-y-4">
        <Field label="اسم المتجر">
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className={inputCls} style={{ borderColor: errors.name ? C.rosewood : C.line }} />
          {errors.name && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.name}</p>}
        </Field>
        <Field label="التصنيف (مثل: أزياء، إلكترونيات، مستلزمات منزلية)">
          <input value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className={inputCls} style={{ borderColor: errors.category ? C.rosewood : C.line }} />
          {errors.category && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.category}</p>}
        </Field>
        <Field label="اسم المالك">
          <input value={form.owner} onChange={(e) => setForm({ ...form, owner: e.target.value })} className={inputCls} style={{ borderColor: errors.owner ? C.rosewood : C.line }} />
          {errors.owner && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.owner}</p>}
        </Field>
      </div>

      <button onClick={submit} className="w-full mt-6 py-2.5 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: C.ink }}>
        إنشاء المتجر ومتابعة
      </button>
    </div>
  );
}

function ProductsTab({ products, setProducts, storeSlug, showToast }) {
  const currency = React.useContext(CurrencyContext);
  const [q, setQ] = useState("");
  const [modal, setModal] = useState(null);
  const [deleteId, setDeleteId] = useState(null);

  const filtered = products.filter((p) => p.name.toLowerCase().includes(q.toLowerCase()));

  const save = (data) => {
    if (modal.mode === "add") {
      setProducts((prev) => [...prev, { ...data, id: Date.now(), storeSlug, sold: 0 }]);
      showToast("تمت إضافة المنتج");
    } else {
      setProducts((prev) => prev.map((p) => (p.id === modal.product.id ? { ...p, ...data } : p)));
      showToast("تم تحديث المنتج");
    }
    setModal(null);
  };

  const remove = (id) => {
    setProducts((prev) => prev.filter((p) => p.id !== id));
    setDeleteId(null);
    showToast("تم حذف المنتج");
  };

  return (
    <div className="bg-white rounded-2xl border" style={{ borderColor: C.line }}>
      <div className="p-5 flex flex-col sm:flex-row sm:items-center gap-3 sm:justify-between border-b" style={{ borderColor: C.line }}>
        <div className="relative flex-1 sm:max-w-xs">
          <Search className="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2" style={{ color: C.slate }} />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ابحث عن منتج"
            className={inputCls + " pr-9"} style={{ borderColor: C.line }} />
        </div>
        <button onClick={() => setModal({ mode: "add" })}
          className="flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: C.ink }}>
          <Plus className="w-4 h-4" /> إضافة منتج
        </button>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-right border-b" style={{ borderColor: C.line, color: C.slate }}>
              <th className="py-3 px-5 font-medium">المنتج</th>
              <th className="py-3 px-5 font-medium">التصنيف</th>
              <th className="py-3 px-5 font-medium">السعر</th>
              <th className="py-3 px-5 font-medium">المخزون</th>
              <th className="py-3 px-5 font-medium">الحالة</th>
              <th className="py-3 px-5 font-medium text-left">الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((pr) => (
              <tr key={pr.id} className="border-b last:border-0" style={{ borderColor: C.line }}>
                <td className="py-3 px-5 flex items-center gap-3">
                  <div className="w-9 h-9 rounded-lg shrink-0" style={{ background: gradientFor(pr.id) }} />
                  <span className="font-medium" style={{ color: C.ink }}>{pr.name}</span>
                </td>
                <td className="py-3 px-5" style={{ color: C.slate }}>{pr.category}</td>
                <td className="py-3 px-5" style={{ color: C.ink }}>{money(pr.price, currency)}</td>
                <td className="py-3 px-5" style={{ color: pr.stock === 0 ? C.rosewood : C.slate }}>{pr.stock}</td>
                <td className="py-3 px-5"><StatusPill status={pr.stock === 0 ? "draft" : pr.status} /></td>
                <td className="py-3 px-5">
                  <div className="flex justify-end gap-2">
                    <button onClick={() => setModal({ mode: "edit", product: pr })} className="p-2 rounded-lg border" style={{ borderColor: C.line }}>
                      <Pencil className="w-3.5 h-3.5" style={{ color: C.ink }} />
                    </button>
                    <button onClick={() => setDeleteId(pr.id)} className="p-2 rounded-lg border" style={{ borderColor: C.line }}>
                      <Trash2 className="w-3.5 h-3.5" style={{ color: C.rosewood }} />
                    </button>
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr>
                <td colSpan={6} className="py-12 text-center text-sm" style={{ color: C.slate }}>
                  {products.length === 0 ? "لا توجد منتجات بعد. أضف أول منتج لك." : "لا توجد منتجات مطابقة لبحثك."}
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>

      {modal && <ProductModal modal={modal} onClose={() => setModal(null)} onSave={save} />}

      {deleteId && (
        <ConfirmDialog
          title="حذف هذا المنتج؟"
          body="سيتم حذفه من كتالوجك ومن المتجر الإلكتروني العام. لا يمكن التراجع عن هذا الإجراء."
          confirmLabel="حذف المنتج"
          danger
          onCancel={() => setDeleteId(null)}
          onConfirm={() => remove(deleteId)}
        />
      )}
    </div>
  );
}

function ProductModal({ modal, onClose, onSave }) {
  const currency = React.useContext(CurrencyContext);
  const currencyMeta = CURRENCY_META[currency] || CURRENCY_META.IQD;
  const editing = modal.product;
  const [form, setForm] = useState({
    name: editing?.name || "",
    category: editing?.category || "",
    price: editing?.price ?? "",
    stock: editing?.stock ?? "",
    status: editing?.status || "active",
    description: editing?.description || "",
  });
  const [errors, setErrors] = useState({});

  const submit = () => {
    const errs = {};
    if (!form.name.trim()) errs.name = "أدخل اسمًا للمنتج";
    if (!form.category.trim()) errs.category = "اختر تصنيفًا";
    if (!(Number(form.price) > 0)) errs.price = "أدخل سعرًا أكبر من صفر";
    if (form.stock === "" || Number(form.stock) < 0) errs.stock = "أدخل الكمية المتوفرة في المخزون";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    onSave({ ...form, price: Number(form.price), stock: Number(form.stock) });
  };

  return (
    <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" style={{ backgroundColor: "#1C1F2699" }}>
      <div className="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div className="p-5 border-b flex items-center justify-between" style={{ borderColor: C.line }}>
          <h3 className="font-semibold" style={{ ...heading, color: C.ink }}>{modal.mode === "add" ? "إضافة منتج" : "تعديل المنتج"}</h3>
          <button onClick={onClose}><X className="w-4 h-4" style={{ color: C.slate }} /></button>
        </div>
        <div className="p-5 space-y-4">
          <Field label="اسم المنتج">
            <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className={inputCls} style={{ borderColor: errors.name ? C.rosewood : C.line }} />
            {errors.name && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.name}</p>}
          </Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="التصنيف">
              <input value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className={inputCls} style={{ borderColor: errors.category ? C.rosewood : C.line }} />
              {errors.category && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.category}</p>}
            </Field>
            <Field label="الحالة">
              <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className={inputCls} style={{ borderColor: C.line }}>
                <option value="active">نشط</option>
                <option value="draft">مسودة</option>
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Field label={`السعر (${currencyMeta.label})`}>
              <input type="number" min="0" step={currencyMeta.decimals === 0 ? "250" : "0.01"} value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} className={inputCls} style={{ borderColor: errors.price ? C.rosewood : C.line }} dir="ltr" />
              {errors.price && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.price}</p>}
            </Field>
            <Field label="المخزون">
              <input type="number" min="0" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} className={inputCls} style={{ borderColor: errors.stock ? C.rosewood : C.line }} dir="ltr" />
              {errors.stock && <p className="text-xs mt-1" style={{ color: C.rosewood }}>{errors.stock}</p>}
            </Field>
          </div>
          <Field label="الوصف">
            <textarea rows={3} value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} className={inputCls} style={{ borderColor: C.line }} />
          </Field>
        </div>
        <div className="p-5 border-t flex justify-end gap-2" style={{ borderColor: C.line }}>
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: C.line, color: C.ink }}>إلغاء</button>
          <button onClick={submit} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: C.ink }}>
            {modal.mode === "add" ? "إضافة المنتج" : "حفظ التغييرات"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ConfirmDialog({ title, body, confirmLabel, danger, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 z-[80] flex items-center justify-center p-4" style={{ backgroundColor: "#1C1F2699" }}>
      <div className="bg-white rounded-2xl w-full max-w-sm p-5">
        <div className="w-10 h-10 rounded-full flex items-center justify-center mb-3" style={{ backgroundColor: danger ? C.rosewoodSoft : C.marigoldSoft }}>
          <AlertTriangle className="w-5 h-5" style={{ color: danger ? C.rosewood : C.marigoldDark }} />
        </div>
        <h3 className="font-semibold" style={{ ...heading, color: C.ink }}>{title}</h3>
        <p className="text-sm mt-1.5" style={{ color: C.slate }}>{body}</p>

          <button onClick={onCancel} className="px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: C.line, color: C.ink }}>إلغاء</button>

        </div>
      </div>
    </div>
  );
}

function AnalyticsTab({ products, orders }) {
  const currency = React.useContext(CurrencyContext);
  const validOrders = orders.filter((o) => o.status !== "cancelled");
  const revenue = validOrders.reduce((a, o) => a + o.total, 0);
  const aov = revenue / Math.max(1, validOrders.length);

  const trend = useMemo(() => {
    const map = {};
    validOrders.forEach((o) => { map[o.date] = (map[o.date] || 0) + o.total; });
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0])).map(([date, revenue]) => ({ date, revenue }));
  }, [validOrders]);

  const topProducts = [...products].filter((p) => p.sold > 0).sort((a, b) => b.sold - a.sold).slice(0, 6)
    .map((p) => ({ name: p.name.split(" ").slice(0, 2).join(" "), sold: p.sold }));

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard icon={DollarSign} label="الإيرادات" value={money(revenue, currency)} tint={C.marigold} />
        <StatCard icon={ClipboardList} label="الطلبات" value={orders.length} tint={C.ink} />
        <StatCard icon={TrendingUp} label="متوسط قيمة الطلب" value={money(aov, currency)} tint={C.sage} />
        <StatCard icon={Package} label="معدل التحويل" value={orders.length > 0 ? "3.2%" : "—"} tint={C.slate} />
      </div>

      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-3 bg-white rounded-2xl border p-5" style={{ borderColor: C.line }}>
          <h3 className="font-semibold mb-4" style={{ ...heading, color: C.ink }}>الإيرادات حسب اليوم</h3>
          {trend.length === 0 ? (
            <div className="h-[240px] flex items-center justify-center text-sm text-center px-6" style={{ color: C.slate }}>
              ستظهر تحليلات المبيعات هنا بعد أول عملية بيع.
            </div>
          ) : (
            <MiniLineChart data={trend} color={C.marigoldDark} />
          )}
        </div>
        <div className="lg:col-span-2 bg-white rounded-2xl border p-5" style={{ borderColor: C.line }}>
          <h3 className="font-semibold mb-4" style={{ ...heading, color: C.ink }}>أكثر المنتجات مبيعًا</h3>
          {topProducts.length === 0 ? (
            <div className="h-[240px] flex items-center justify-center text-sm text-center px-6" style={{ color: C.slate }}>
              سيظهر أكثر المنتجات مبيعًا هنا بعد أول طلب.
            </div>
          ) : (
            <MiniBarList data={topProducts} color={C.sage} />
          )}
        </div>
      </div>
    </div>
  );
}

function Storefront({ stores, products, currentSlug, setCurrentSlug, cart, setCart, orders, setOrders, setProducts, showToast, onGoMerchant }) {
  const currency = React.useContext(CurrencyContext);
  const priceRange = PRICE_RANGE[currency] || PRICE_RANGE.default;
  const activeStores = stores.filter((s) => s.status === "active");
  const effectiveSlug = activeStores.some((s) => s.slug === currentSlug) ? currentSlug : (activeStores[0]?.slug || null);
  const store = stores.find((s) => s.slug === effectiveSlug);

  const [search, setSearch] = useState("");
  const [activeCats, setActiveCats] = useState([]);
  const [maxPrice, setMaxPrice] = useState(priceRange.default);
  const [sort, setSort] = useState("featured");
  const [showFilters, setShowFilters] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);
  const [checkout, setCheckout] = useState(false);

  if (!store) return <EmptyStorefront onGoMerchant={onGoMerchant} />;

  const storeProducts = products.filter((p) => p.storeSlug === store.slug);
  const categories = [...new Set(storeProducts.map((p) => p.category))];

  const toggleCat = (c) => setActiveCats((prev) => (prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]));

  const filtered = useMemo(() => {
    let list = storeProducts.filter((p) =>
      p.name.toLowerCase().includes(search.toLowerCase()) &&
      (activeCats.length === 0 || activeCats.includes(p.category)) &&
      p.price <= maxPrice
    );
    if (sort === "price-asc") list = [...list].sort((a, b) => a.price - b.price);
    if (sort === "price-desc") list = [...list].sort((a, b) => b.price - a.price);
    if (sort === "name") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }, [storeProducts, search, activeCats, maxPrice, sort]);

  const addToCart = (product) => {
    if (product.stock === 0) return;
    setCart((prev) => {
      const existing = prev.find((i) => i.id === product.id);
      if (existing) return prev.map((i) => (i.id === product.id ? { ...i, qty: Math.min(i.qty + 1, product.stock) } : i));
      return [...prev, { id: product.id, name: product.name, price: product.price, qty: 1, stock: product.stock }];
    });
    showToast(`تمت إضافة ${product.name} إلى السلة`);
  };

  const cartCount = cart.reduce((a, i) => a + i.qty, 0);
  const subtotal = cart.reduce((a, i) => a + i.qty * i.price, 0);

  const switchStore = (slug) => {
    setCurrentSlug(slug);
    setCart([]);
    setCartOpen(false);
    setActiveCats([]);
    setSearch("");
  };

  const handlePlaceOrder = (shipping) => {
    const orderId = "ORD-" + Math.floor(100000 + Math.random() * 899999);
    setOrders((prev) => [
      { id: orderId, storeSlug: store.slug, customer: shipping.name, items: cart.map((i) => ({ name: i.name, qty: i.qty })), total: subtotal + (currency === "IQD" ? 5000 : 6.5) + subtotal * 0.08, status: "pending", date: new Date().toISOString().slice(0, 10) },
      ...prev,
    ]);
    setProducts((prev) => prev.map((p) => {
      const item = cart.find((i) => i.id === p.id);
      if (!item) return p;
      return { ...p, stock: Math.max(0, p.stock - item.qty), sold: (p.sold || 0) + item.qty };
    }));
    return orderId;
  };

  return (
    <div className="bg-white rounded-2xl border overflow-hidden" style={{ borderColor: C.line }}>
      {/* fake browser bar */}
      <div className="flex items-center gap-3 px-4 py-2.5 border-b" style={{ backgroundColor: C.paperAlt, borderColor: C.line }}>
        <div className="flex gap-1.5">
          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: "#E4A2A2" }} />
          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: "#E9CD9B" }} />
          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: "#A7CDB2" }} />
        </div>
        <div className="flex-1 bg-white rounded-md px-3 py-1 text-xs" style={{ color: C.slate }}>
          <LtrTag>souqna.app/store/{store.slug}</LtrTag>
        </div>
        <select value={store.slug} onChange={(e) => switchStore(e.target.value)}
          className="text-xs font-medium rounded-md px-2 py-1.5 border" style={{ borderColor: C.line, color: C.ink }}>
          {activeStores.map((s) => (
            <option key={s.slug} value={s.slug}>{s.name}</option>
          ))}
        </select>
      </div>

      {/* storefront header */}
      <div className={store.banner === "bold" ? "p-8 md:p-12" : "p-6 md:p-10"} style={{ backgroundColor: store.banner === "bold" ? store.accent : C.paper }}>
        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-xl flex items-center justify-center font-semibold text-lg"
              style={{ backgroundColor: store.banner === "bold" ? "white" : store.accent, color: store.banner === "bold" ? store.accent : "white", ...heading }}>
              {store.logoInitial}
            </div>
            <div>
              <h1 className="text-2xl font-semibold" style={{ ...heading, color: store.banner === "bold" ? "white" : C.ink }}>{store.name}</h1>
              <p className="text-sm" style={{ color: store.banner === "bold" ? "#ffffffd0" : C.slate }}>{store.tagline}</p>
            </div>
          </div>
          <button onClick={() => setCartOpen(true)}
            className="relative flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium self-start md:self-auto"
            style={{ backgroundColor: store.banner === "bold" ? "white" : store.accent, color: store.banner === "bold" ? store.accent : "white" }}>
            <ShoppingCart className="w-4 h-4" /> السلة
            {cartCount > 0 && (
              <span className="absolute -top-2 -left-2 w-5 h-5 rounded-full text-[11px] flex items-center justify-center text-white" style={{ backgroundColor: C.rosewood }}>{cartCount}</span>
            )}
          </button>
        </div>
      </div>

      {/* catalog */}
      <div className="p-5 md:p-8 grid md:grid-cols-[220px_1fr] gap-6">
        <button onClick={() => setShowFilters((v) => !v)} className="md:hidden flex items-center justify-between px-3 py-2 rounded-lg border text-sm font-medium" style={{ borderColor: C.line, color: C.ink }}>
          الفلاتر <SlidersHorizontal className="w-4 h-4" />
        </button>

        <aside className={(showFilters ? "block" : "hidden") + " md:block space-y-6"}>
          <div>
            <p className="text-xs font-medium mb-2" style={{ color: C.slate }}>بحث</p>
            <div className="relative">
              <Search className="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2" style={{ color: C.slate }} />
              <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="ابحث عن منتج"
                className={inputCls + " pr-9"} style={{ borderColor: C.line }} />
            </div>
          </div>
          <div>
            <p className="text-xs font-medium mb-2" style={{ color: C.slate }}>التصنيف</p>
            <div className="space-y-1.5">
              {categories.length === 0 && <p className="text-xs" style={{ color: C.slate }}>لا توجد تصنيفات بعد.</p>}
              {categories.map((c) => (
                <label key={c} className="flex items-center gap-2 text-sm cursor-pointer" style={{ color: C.ink }}>
                  <input type="checkbox" checked={activeCats.includes(c)} onChange={() => toggleCat(c)} className="rounded" style={{ accentColor: store.accent }} />
                  {c}
                </label>
              ))}
            </div>
          </div>
          <div>
            <p className="text-xs font-medium mb-2" style={{ color: C.slate }}>أقصى سعر — {money(maxPrice, currency)}</p>
            <input type="range" min={priceRange.min} max={priceRange.max} step={priceRange.step} value={maxPrice} onChange={(e) => setMaxPrice(Number(e.target.value))} className="w-full" style={{ accentColor: store.accent }} />
          </div>
          <div>
            <p className="text-xs font-medium mb-2" style={{ color: C.slate }}>الترتيب حسب</p>
            <select value={sort} onChange={(e) => setSort(e.target.value)} className={inputCls} style={{ borderColor: C.line }}>
              <option value="featured">المميز</option>
              <option value="price-asc">السعر: من الأقل إلى الأعلى</option>
              <option value="price-desc">السعر: من الأعلى إلى الأقل</option>
              <option value="name">الاسم أ-ي</option>
            </select>
          </div>
        </aside>

        <div>
          <p className="text-sm mb-4" style={{ color: C.slate }}>{filtered.length} منتج</p>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {filtered.map((p) => (
              <div key={p.id} className="rounded-xl border overflow-hidden flex flex-col" style={{ borderColor: C.line }}>
                <div className="aspect-[4/3]" style={{ background: gradientFor(p.id) }} />
                <div className="p-4 flex flex-col gap-1 flex-1">
                  <p className="text-xs" style={{ color: C.slate }}>{p.category}</p>
                  <p className="font-medium text-sm" style={{ color: C.ink }}>{p.name}</p>
                  <p className="text-sm font-semibold mt-1" style={{ color: C.ink }}>{money(p.price, currency)}</p>
                  <button onClick={() => addToCart(p)} disabled={p.stock === 0}
                    className="mt-auto pt-3 text-sm font-medium rounded-lg py-2 disabled:opacity-40"
                    style={{ backgroundColor: p.stock === 0 ? C.paperAlt : store.accent, color: p.stock === 0 ? C.slate : "white" }}>
                    {p.stock === 0 ? "نفدت الكمية" : "أضف إلى السلة"}
                  </button>
                </div>
              </div>
            ))}
            {filtered.length === 0 && (
              <div className="col-span-full py-16 text-center text-sm" style={{ color: C.slate }}>
                {storeProducts.length === 0 ? "لم يضف هذا المتجر أي منتجات بعد." : "لا توجد منتجات مطابقة لفلاترك. حاول توسيع نطاق البحث."}
              </div>
            )}
          </div>
        </div>
      </div>

      {cartOpen && (
        <CartDrawer cart={cart} setCart={setCart} subtotal={subtotal} accent={store.accent}
          onClose={() => setCartOpen(false)} onCheckout={() => { setCartOpen(false); setCheckout(true); }} />
      )}
      {checkout && (
        <CheckoutModal cart={cart} setCart={setCart} subtotal={subtotal} accent={store.accent} storeName={store.name}
          onClose={() => setCheckout(false)} onPlaceOrder={handlePlaceOrder} />
      )}
    </div>
  );
}

function CartDrawer({ cart, setCart, subtotal, accent, onClose, onCheckout }) {
  const currency = React.useContext(CurrencyContext);
  const updateQty = (id, qty) => setCart((prev) => prev.map((i) => (i.id === id ? { ...i, qty: Math.max(1, Math.min(qty, i.stock)) } : i)));
  const removeItem = (id) => setCart((prev) => prev.filter((i) => i.id !== id));

  return (
    <div className="fixed inset-0 z-[70] flex justify-start">
      <div className="absolute inset-0" style={{ backgroundColor: "#1C1F2699" }} onClick={onClose} />
      <div className="relative w-full max-w-sm bg-white h-full flex flex-col shadow-2xl">
        <div className="p-5 border-b flex items-center justify-between" style={{ borderColor: C.line }}>
          <h3 className="font-semibold flex items-center gap-2" style={{ ...heading, color: C.ink }}><ShoppingCart className="w-4 h-4" /> سلة التسوق</h3>
          <button onClick={onClose}><X className="w-4 h-4" style={{ color: C.slate }} /></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          {cart.length === 0 && <p className="text-sm text-center py-16" style={{ color: C.slate }}>سلة التسوق فارغة. أضف شيئًا يعجبك.</p>}
          {cart.map((item) => (
            <div key={item.id} className="flex gap-3">
              <div className="w-14 h-14 rounded-lg shrink-0" style={{ background: gradientFor(item.id) }} />
              <div className="flex-1">
                <p className="text-sm font-medium" style={{ color: C.ink }}>{item.name}</p>
                <p className="text-xs" style={{ color: C.slate }}>{money(item.price, currency)} للقطعة</p>
                <div className="flex items-center gap-2 mt-1.5">
                  <button onClick={() => updateQty(item.id, item.qty - 1)} className="w-6 h-6 rounded-md border flex items-center justify-center" style={{ borderColor: C.line }}><Minus className="w-3 h-3" /></button>
                  <span className="text-sm w-5 text-center">{item.qty}</span>
                  <button onClick={() => updateQty(item.id, item.qty + 1)} className="w-6 h-6 rounded-md border flex items-center justify-center" style={{ borderColor: C.line }}><Plus className="w-3 h-3" /></button>
                  <button onClick={() => removeItem(item.id)} className="mr-auto text-xs" style={{ color: C.rosewood }}>إزالة</button>
                </div>
              </div>
              <p className="text-sm font-medium" style={{ color: C.ink }}>{money(item.price * item.qty, currency)}</p>
            </div>
          ))}
        </div>
        <div className="p-5 border-t space-y-3" style={{ borderColor: C.line }}>
          <div className="flex justify-between text-sm" style={{ color: C.slate }}>
            <span>المجموع الفرعي</span><span style={{ color: C.ink }} className="font-medium">{money(subtotal, currency)}</span>
          </div>
          <button onClick={onCheckout} disabled={cart.length === 0}
            className="w-full py-3 rounded-xl text-sm font-medium text-white disabled:opacity-40" style={{ backgroundColor: accent }}>
            إتمام الشراء
          </button>
        </div>
      </div>
    </div>
  );
}

function CheckoutModal({ cart, setCart, subtotal, accent, storeName, onClose, onPlaceOrder }) {
  const currency = React.useContext(CurrencyContext);
  const [step, setStep] = useState(0);
  const [shipping, setShipping] = useState({ name: "", email: "", address: "", city: "", zip: "" });
  const [payment, setPayment] = useState({ card: "", expiry: "", cvc: "" });
  const [errors, setErrors] = useState({});
  const [orderNumber, setOrderNumber] = useState("");

  const shippingFee = currency === "IQD" ? 5000 : 6.5;
  const tax = subtotal * 0.08;
  const total = subtotal + shippingFee + tax;

  const validateShipping = () => {
    const e = {};
    if (!shipping.name.trim()) e.name = "هذا الحقل مطلوب";
    if (!/^\S+@\S+\.\S+$/.test(shipping.email)) e.email = "أدخل بريدًا إلكترونيًا صالحًا";
    if (!shipping.address.trim()) e.address = "هذا الحقل مطلوب";
    if (!shipping.city.trim()) e.city = "هذا الحقل مطلوب";
    if (!/^\d{4,6}$/.test(shipping.zip)) e.zip = "أدخل رمزًا بريديًا صالحًا";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const validatePayment = () => {
    const e = {};
    if (!/^\d{13,19}$/.test(payment.card.replace(/\s/g, ""))) e.card = "أدخل رقم بطاقة صالحًا";
    if (!/^\d{2}\/\d{2}$/.test(payment.expiry)) e.expiry = "الصيغة: MM/YY";
    if (!/^\d{3,4}$/.test(payment.cvc)) e.cvc = "٣ إلى ٤ أرقام";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const placeOrder = () => {
    if (!validatePayment()) return;
    const id = onPlaceOrder(shipping);
    setOrderNumber(id);
    setStep(3);
  };

  const finish = () => { setCart([]); onClose(); };

  return (
    <div className="fixed inset-0 z-[80] flex items-center justify-center p-4" style={{ backgroundColor: "#1C1F2699" }}>
      <div className="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto">
        <div className="p-5 border-b flex items-center justify-between" style={{ borderColor: C.line }}>
          <h3 className="font-semibold" style={{ ...heading, color: C.ink }}>إتمام الشراء · {storeName}</h3>
          {step < 3 && <button onClick={onClose}><X className="w-4 h-4" style={{ color: C.slate }} /></button>}
        </div>

        {step < 3 && (
          <div className="flex px-5 pt-4 gap-2">
            {[0, 1, 2].map((i) => (
              <div key={i} className="flex-1 h-1.5 rounded-full" style={{ backgroundColor: i <= step ? accent : C.paperAlt }} />
            ))}
          </div>
        )}

        <div className="p-5">
          {step === 0 && (
            <div className="space-y-4">
              {cart.map((i) => (
                <div key={i.id} className="flex justify-between text-sm">
                  <span style={{ color: C.ink }}>{i.name} × {i.qty}</span>
                  <span style={{ color: C.ink }}>{money(i.price * i.qty, currency)}</span>
                </div>
              ))}
              <div className="border-t pt-3 space-y-1.5" style={{ borderColor: C.line }}>
                <div className="flex justify-between text-sm" style={{ color: C.slate }}><span>المجموع الفرعي</span><span>{money(subtotal, currency)}</span></div>
                <div className="flex justify-between text-sm" style={{ color: C.slate }}><span>الشحن</span><span>{money(shippingFee, currency)}</span></div>
                <div className="flex justify-between text-sm" style={{ color: C.slate }}><span>الضريبة</span><span>{money(tax, currency)}</span></div>
                <div className="flex justify-between text-sm font-semibold pt-1" style={{ color: C.ink }}><span>الإجمالي</span><span>{money(total, currency)}</span></div>
              </div>
            </div>
          )}

          {step === 1 && (
            <div className="space-y-4">
              <Field label="الاسم الكامل"><input value={shipping.name} onChange={(e) => setShipping({ ...shipping, name: e.target.value })} className={inputCls} style={{ borderColor: errors.name ? C.rosewood : C.line }} /></Field>
              <Field label="البريد الإلكتروني"><input value={shipping.email} onChange={(e) => setShipping({ ...shipping, email: e.target.value })} className={inputCls} style={{ borderColor: errors.email ? C.rosewood : C.line }} dir="ltr" /></Field>
              <Field label="العنوان"><input value={shipping.address} onChange={(e) => setShipping({ ...shipping, address: e.target.value })} className={inputCls} style={{ borderColor: errors.address ? C.rosewood : C.line }} /></Field>
              <div className="grid grid-cols-2 gap-4">
                <Field label="المدينة"><input value={shipping.city} onChange={(e) => setShipping({ ...shipping, city: e.target.value })} className={inputCls} style={{ borderColor: errors.city ? C.rosewood : C.line }} /></Field>
                <Field label="الرمز البريدي"><input value={shipping.zip} onChange={(e) => setShipping({ ...shipping, zip: e.target.value })} className={inputCls} style={{ borderColor: errors.zip ? C.rosewood : C.line }} dir="ltr" /></Field>
              </div>
            </div>
          )}

          {step === 2 && (
            <div className="space-y-4">
              <Field label="رقم البطاقة"><input placeholder="4242 4242 4242 4242" value={payment.card} onChange={(e) => setPayment({ ...payment, card: e.target.value })} className={inputCls} style={{ borderColor: errors.card ? C.rosewood : C.line }} dir="ltr" /></Field>
              <div className="grid grid-cols-2 gap-4">
                <Field label="تاريخ الانتهاء"><input placeholder="MM/YY" value={payment.expiry} onChange={(e) => setPayment({ ...payment, expiry: e.target.value })} className={inputCls} style={{ borderColor: errors.expiry ? C.rosewood : C.line }} dir="ltr" /></Field>
                <Field label="رمز الأمان CVC"><input placeholder="123" value={payment.cvc} onChange={(e) => setPayment({ ...payment, cvc: e.target.value })} className={inputCls} style={{ borderColor: errors.cvc ? C.rosewood : C.line }} dir="ltr" /></Field>
              </div>
              <p className="text-xs flex items-center gap-1.5" style={{ color: C.slate }}><CreditCard className="w-3.5 h-3.5" /> هذه عملية دفع تجريبية — لن يُخصم أي مبلغ فعلي من البطاقة.</p>
            </div>
          )}

          {step === 3 && (
            <div className="text-center py-6">
              <div className="w-14 h-14 rounded-full mx-auto flex items-center justify-center mb-4" style={{ backgroundColor: C.sageSoft }}>
                <Check className="w-7 h-7" style={{ color: C.sage }} />
              </div>
              <h4 className="font-semibold text-lg" style={{ ...heading, color: C.ink }}>تم تأكيد الطلب</h4>
              <p className="text-sm mt-1" style={{ color: C.slate }}>الطلب <LtrTag>{orderNumber}</LtrTag> · {money(total, currency)}</p>
              <p className="text-sm mt-3 flex items-center justify-center gap-1.5" style={{ color: C.slate }}>
                <Truck className="w-4 h-4" /> الوصول خلال 3-5 أيام عمل إلى {shipping.city || "عنوانك"}
              </p>
            </div>
          )}
        </div>

        <div className="p-5 border-t flex justify-between gap-2" style={{ borderColor: C.line }}>
          {step > 0 && step < 3 ? (
            <button onClick={() => setStep(step - 1)} className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: C.line, color: C.ink }}>
              <ArrowRight className="w-4 h-4" /> رجوع
            </button>
          ) : <span />}

          {step === 0 && (
            <button onClick={() => setStep(1)} className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: accent }}>
              متابعة إلى الشحن <ArrowLeft className="w-4 h-4" />
            </button>
          )}
          {step === 1 && (
            <button onClick={() => validateShipping() && setStep(2)} className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: accent }}>
              متابعة إلى الدفع <ArrowLeft className="w-4 h-4" />
            </button>
          )}
          {step === 2 && (
            <button onClick={placeOrder} className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: accent }}>
              إتمام الطلب <MapPin className="w-4 h-4" />
            </button>
          )}
          {step === 3 && (
            <button onClick={finish} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ backgroundColor: C.ink }}>
              متابعة التسوق
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const [role, setRole] = usePersistentState("role", "super");
  const [stores, setStores] = usePersistentState("stores", []);
  const [products, setProducts] = usePersistentState("products", []);
  const [orders, setOrders] = usePersistentState("orders", []);
  const [settings, setSettings] = usePersistentState("settings", {
    platformName: "سوقنا",
    supportEmail: "support@souqna.app",
    commission: 8,
    currency: "IQD",
    allowSignups: true,
    maintenance: false,
  });
  const [merchantStoreSlug, setMerchantStoreSlug] = usePersistentState("merchantStoreSlug", null);
  const [currentSlug, setCurrentSlug] = usePersistentState("currentSlug", null);
  const [cart, setCart] = usePersistentState("cart", []);
  const [toast, setToast] = useState(null);

  const showToast = (message, type = "ok") => {
    setToast({ message, type });
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 2600);
  };

  const merchantStore = stores.find((s) => s.slug === merchantStoreSlug) || null;

  const createStore = (store) => {
    setStores((prev) => [...prev, store]);
    setMerchantStoreSlug(store.slug);
    showToast("تم إنشاء متجرك! بانتظار موافقة المشرف العام ليظهر للعامة.");
  };

  return (
    <CurrencyContext.Provider value={settings.currency}>
      <div dir="rtl" lang="ar" className="min-h-screen" style={{ backgroundColor: C.paper, fontFamily: "'Tajawal', sans-serif" }}>
        <style>{FONT_LINK}</style>
        <TopBar role={role} setRole={setRole} platformName={settings.platformName} />
        <div className="max-w-7xl mx-auto px-4 md:px-8 py-8">
          {role === "super" && (
            <SuperAdmin stores={stores} setStores={setStores} settings={settings} setSettings={setSettings} showToast={showToast} />
          )}
          {role === "merchant" && (
            merchantStore ? (
              <MerchantDashboard
                store={merchantStore}
                setStores={setStores}
                products={products}
                setProducts={setProducts}
                orders={orders}
                setOrders={setOrders}
                showToast={showToast}
              />
            ) : (
              <CreateStoreScreen onCreate={createStore} />
            )
          )}
          {role === "storefront" && (
            <Storefront
              stores={stores}
              products={products}
              currentSlug={currentSlug}
              setCurrentSlug={setCurrentSlug}
              cart={cart}
              setCart={setCart}
              orders={orders}
              setOrders={setOrders}
              setProducts={setProducts}
              showToast={showToast}
              onGoMerchant={() => setRole("merchant")}
            />
          )}
        </div>
        <Toast toast={toast} />
      </div>
    </CurrencyContext.Provider>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
